<style>
:root{color-scheme:dark;--bg:#08080a;--surface:#0e0e10;--card:#141417;--hover:#232327;--line:#ffffff12;--ink:#f2f2f5;--muted:#9fa0a8;--accent:#4267b2;--green:#53d4a2;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 14px}button:hover{background:var(--hover)}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--accent);color:#fff;border-color:transparent}input,select{background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:8px;max-width:100%}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.04em;font-weight:550}h2{font-size:18px;letter-spacing:-.025em;font-weight:550}h3{font-size:15px;font-weight:550}small,.muted{color:var(--muted)}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--surface)}.logo{font-weight:650;letter-spacing:.08em;display:flex;gap:10px;align-items:center}.logo svg{width:22px}.address{margin:auto;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:5px 22px;border-radius:7px;font-size:12px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 58px)}aside{padding:26px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}.scope{padding:0 12px}.scope b{display:block;font-size:16px}.scope small{font-size:12px}nav{display:grid;gap:5px}nav button{border:0;text-align:left;background:transparent;color:var(--muted);display:flex;gap:12px;padding:12px}nav button.active{background:var(--hover);color:var(--ink)}.navicon{width:18px;height:18px;display:inline-flex}svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.aside-bottom{margin-top:auto;padding:12px;color:var(--muted);font-size:12px}.online{color:var(--green)}main{padding:34px 42px;max-width:1600px;width:100%;margin:auto;align-self:start}.heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:26px}.heading p{margin-top:5px;color:var(--muted)}.notice{padding:12px 16px;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin-bottom:26px;background:var(--surface);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:20px}.stat strong{display:block;font-size:32px;letter-spacing:-.04em;font-weight:500;margin:12px 0 4px}.stat small{font-size:12px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.panel{padding:22px;margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.rows{display:grid;gap:0}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--muted)}.row b{font-weight:500}.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--hover);color:var(--muted)}.badge.ok{color:var(--green);background:#53d4a212}.badge.warn{color:#e8be79;background:#e8be7912}.badge.bad{color:var(--red);background:#ff858512}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-weight:400;font-size:12px;padding:0 12px 14px}td{padding:16px 12px;border-top:1px solid var(--line)}td small{display:block}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.event{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}.event i{width:6px;height:6px;background:var(--accent);border-radius:50%;margin-top:8px;flex-shrink:0}.event small{display:block}.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}.price{font-size:32px;letter-spacing:-.04em;margin:18px 0}.price small{font-size:14px;letter-spacing:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.form{display:grid;gap:16px}.form label{display:grid;gap:7px;color:var(--muted)}.empty{padding:32px;text-align:center;color:var(--muted)}pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:auto;padding:18px;font-size:12px;color:#b7c3dc;white-space:pre-wrap;word-break:break-word}.flow{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted)}.flow b{padding:12px;background:var(--surface);border-radius:8px;color:var(--ink);font-weight:450;flex:1;text-align:center}dialog{color:var(--ink);background:var(--card);border:1px solid #ffffff24;border-radius:16px;padding:28px;width:500px;max-width:92vw}dialog::backdrop{background:#0009;backdrop-filter:blur(5px)}dialog h2{margin-bottom:20px}dialog .actions{margin-top:24px;justify-content:flex-end}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 20px;z-index:10;max-width:90vw}[hidden]{display:none!important}.role-switch{display:flex;gap:3px;border:1px solid var(--line);padding:3px;border-radius:9px}.role-switch button{font-size:12px;padding:5px 11px;border:0;background:transparent;color:var(--muted)}.role-switch button.on{background:var(--hover);color:var(--ink)}.light{color-scheme:light;--bg:#e4e8ee;--surface:#f4f6f9;--card:#fff;--hover:#e5e9ef;--line:#14264216;--ink:#0e141f;--muted:#606770;--accent:#4267b2;--green:#16835c;--red:#c94747}.light pre{color:#4267b2}@media(max-width:1000px){main{padding:26px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.shell{grid-template-columns:190px 1fr}.address{display:none}}@media(max-width:680px){header{padding:0 12px;gap:12px}.logo{font-size:12px}.shell{display:block}aside{padding:16px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.scope,.aside-bottom{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}.navicon{display:none}main{padding:22px 16px}.heading{align-items:start}h1{font-size:24px}.plans,.flow{flex-wrap:wrap}.stat{padding:16px}.stat strong{font-size:27px}.heading .actions{justify-content:end}header>button{padding:7px}}

.id{font-variant-numeric:tabular-nums;letter-spacing:.025em}.hero-id{font-size:32px;font-weight:500;letter-spacing:-.03em;margin:16px 0}.client-switch{display:flex;gap:10px;align-items:center;margin-bottom:24px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}.client-switch span{color:var(--muted);font-size:12px}.bridge{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:14px;margin:22px 0}.bridge .node{text-align:center;border:1px solid var(--line);border-radius:12px;padding:24px 12px;background:var(--surface)}.node small{display:block;margin-top:8px}.node.server{border-color:var(--accent)}.bridge .arrow{color:var(--muted)}.help{font-size:12px;color:var(--muted);line-height:1.7}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.light button.primary{color:#fff}.notice strong{font-weight:500;color:var(--ink)}button.danger{color:var(--red)}.timeline{border-left:1px solid var(--line);padding-left:18px}.timeline p{margin:12px 0}.summary{display:flex;gap:12px;align-items:center}.summary .badge{margin-left:auto}@media(max-width:680px){.bridge{grid-template-columns:1fr}.bridge .arrow{text-align:center;transform:rotate(90deg)}.fields{grid-template-columns:1fr}.hero-id{font-size:26px}.address{display:none}header{flex-wrap:wrap;height:auto;min-height:58px;padding-top:10px;padding-bottom:10px}}
</style>
<header><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 21 6v6c0 5-5 9-9 10-4-1-9-5-9-10V6Z"/><path d="m8 12 3 3 5-6"/></svg>SHELTER</div><div class="address">shelter://relay-demo</div><div class="role-switch"><button data-role="admin">Администратор</button><button data-role="user">Пользователь</button></div><button id="theme" title="Сменить тему" aria-label="Сменить тему">◐</button></header>
<div class="shell"><aside><div class="scope"><b id="scope"></b><small id="identity"></small></div><nav id="nav" aria-label="Разделы панели"></nav><div class="aside-bottom"><span class="online">● Автономная демоверсия</span><p style="margin:10px 0">Состояние только в памяти.<br>Нет запросов в сеть.</p><button id="reset">Начать заново</button></div></aside><main><div class="heading"><div><h1 id="title"></h1><p id="subtitle"></p></div></div><div class="notice"><strong>Сервер — только мост.</strong> Задачи, доски, имена и содержимое обмена остаются в браузерах. Здесь — связи по ID, результат доставки и расчёты подписки. Демоданные сбрасываются при перезагрузке файла.</div><div id="client-controls"></div><div id="view"></div></main></div>
<dialog id="modal"><h2 id="modal-title"></h2><form id="modal-form"><div id="modal-body"></div><div class="actions"><button type="button" id="cancel">Отмена</button><button class="primary" type="submit">Подтвердить</button></div></form></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
// Удаляем только устаревшее состояние прежней демоверсии с доской задач.
try { localStorage.removeItem('shelter:server-demo:v1'); } catch (_) {}
const $=s=>document.querySelector(s),now=()=>new Date().toISOString(),uid=()=>Math.random().toString(36).slice(2,10),rub=n=>(n/100).toLocaleString('ru-RU')+' ₽',date=d=>d?new Date(d).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A='SH-K7MP-4N8R',B='SH-T9WX-6D3H',C='SH-R5CJ-8V2F',ID=/^SH-[A-Z2-9]{4}-[A-Z2-9]{4}$/;
const plans={month:{name:'Месяц',days:30,amount:29900},year:{name:'Год',days:365,amount:239000}};
function seed(){return {role:'admin',client:A,theme:'dark',accounts:[A,B,C],presence:{[A]:true,[B]:true,[C]:false},links:[],orders:[{id:'ord_example',user:C,plan:'month',amount:29900,status:'paid',created:now(),paidAt:now()}],revoked:[],paymentEvents:[],events:[{time:now(),type:'demo.started',text:'Мост готов. Клиенты 1 и 2 подключены.'}],relay:{attempts:0,delivered:0,rejected:0,inflight:0},lastDelivery:null,verificationAvailable:true,releases:[{version:'1.4.0',channel:'stable',notes:'Демонстрационная запись каталога',published:now()}],channel:'stable',min:'1.2.0'};}
// Нет базы задач, конвертов или очереди. Даже демосостояние не пишется на диск.
let db=seed(),page='overview',search='',filter='all';
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4300);}
function log(type,text){db.events.unshift({time:now(),type,text});db.events=db.events.slice(0,60);}
function admin(){if(db.role!=='admin')throw Error('Требуется роль администратора');}
function user(){if(db.role!=='user')throw Error('Операция доступна только пользователю');}
function paidOrders(id){return db.orders.filter(o=>o.user===id&&o.status==='paid').sort((a,b)=>a.paidAt.localeCompare(b.paidAt));}
function entitlement(id){if(!db.verificationAvailable)return {active:false,reason:'verification_unavailable',expiresAt:null};if(db.revoked.includes(id))return {active:false,reason:'revoked',expiresAt:null};let expiry=0;for(const o of paidOrders(id))expiry=Math.max(expiry,Date.parse(o.paidAt))+plans[o.plan].days*864e5;return {active:expiry>Date.now(),reason:expiry>Date.now()?'paid':'no_subscription',expiresAt:expiry?new Date(expiry).toISOString():null};}
function pair(a,b){return [a,b].sort().join('|');}
function connected(a,b){return db.links.some(l=>pair(l.from,l.to)===pair(a,b)&&l.status==='active');}
function requestLink(target){user();target=String(target).trim().toUpperCase();if(!ID.test(target))throw Error('ID должен быть в формате SH-XXXX-XXXX');if(target===db.client)throw Error('Нельзя связаться с собственным ID');if(!db.accounts.includes(target))throw Error('ID не найден в демонстрационном реестре');if(db.links.some(l=>pair(l.from,l.to)===pair(db.client,target)))throw Error('Связь или приглашение уже существует');db.links.push({id:uid(),from:db.client,to:target,status:'pending',created:now()});log('link.requested',db.client+' → '+target+' · ожидается согласие');}
function acceptLink(id){user();const l=db.links.find(l=>l.id===id);if(!l||l.to!==db.client||l.status!=='pending')throw Error('Нет входящего приглашения для этого ID');l.status='active';log('link.accepted','Связь подтверждена: '+l.from+' ↔ '+l.to);}
function removeLink(id){user();const l=db.links.find(l=>l.id===id);if(!l||![l.from,l.to].includes(db.client))throw Error('Связь недоступна');db.links=db.links.filter(l=>l.id!==id);log('link.removed','Связь разорвана: '+l.from+' ↔ '+l.to);}
function relay(target){user();db.relay.attempts++;try{if(!connected(db.client,target))throw Error('Нет подтверждённой связи с получателем');if(!db.presence[db.client])throw Error('Отправитель отключён');if(!db.presence[target])throw Error('Получатель не в сети. Пакет не сохранён; повторная отправка — на клиенте');
// Синтетический непрозрачный пакет возникает только во время вызова.
// Никаких названий, задач или ключей здесь нет. Это не реализация шифрования.
const transient=new Uint8Array(256);db.relay.inflight=transient.byteLength;
db.lastDelivery={from:db.client,to:target,bytes:transient.byteLength,at:now(),status:'delivered'};
transient.fill(0);db.relay.inflight=0;db.relay.delivered++;log('relay.delivered','Доставлен тестовый сигнал: '+db.client+' → '+target+' · тело не сохранено');return db.lastDelivery;
}catch(e){db.relay.inflight=0;db.relay.rejected++;db.lastDelivery=null;log('relay.rejected','Доставка отклонена: '+db.client+' → '+target);throw e;}}
function checkout(plan){user();if(!plans[plan])throw Error('Неизвестный тариф');if(!db.verificationAvailable)throw Error('Платёжный сервис недоступен');const p=plans[plan],o={id:'ord_'+uid(),user:db.client,plan,amount:p.amount,status:'pending',created:now()};db.orders.unshift(o);log('checkout.created','Заказ '+o.id+' · '+db.client+' · '+rub(o.amount));return o;}
function paymentWebhook(id){admin();if(!db.verificationAvailable)throw Error('Сервис недоступен');const o=db.orders.find(o=>o.id===id);if(!o)throw Error('Заказ не найден');const eventId='demo_paid_'+o.id;if(db.paymentEvents.includes(eventId))return false;if(o.status!=='pending')throw Error('Заказ уже закрыт');db.paymentEvents.push(eventId);o.status='paid';o.paidAt=now();db.revoked=db.revoked.filter(x=>x!==o.user);log('payment.succeeded','Демо-событие оплаты подтверждено: '+o.id);return true;}
const badge=(text,kind='')=>'<span class="badge '+kind+'">'+esc(text)+'</span>';
const planLabel=p=>plans[p]?.name||'—';
function orderBadge(s){return badge(({paid:'Оплачен',pending:'Ожидает оплаты',refunded:'Возвращён'})[s]||s,s==='paid'?'ok':s==='pending'?'warn':'');}
function stat(label,value,sub){return `<div class="stat"><span class="muted">${label}</span><strong>${value}</strong><small>${sub}</small></div>`;}
function rows(a){return '<div class="rows">'+a.map(([l,v])=>`<div class="row"><span>${l}</span><b>${v}</b></div>`).join('')+'</div>';}
function activity(n=5){return db.events.slice(0,n).map(e=>`<div class="event"><i></i><div>${esc(e.text)}<small>${esc(e.type)} · ${date(e.time)}</small></div></div>`).join('');}
const icons=['<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>','<circle cx="8" cy="9" r="3"/><circle cx="17" cy="9" r="3"/><path d="M2 21v-4a6 6 0 0 1 12 0v4m2-10a6 6 0 0 1 6 6v4"/>','<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18m-14 5h4"/>','<path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/>','<path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/>','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'];
const menus={admin:[['overview','Обзор моста',0],['accounts','Обезличенные ID',1],['orders','Платежи и доступ',2],['relay','Транспорт',3],['catalog','Каталог релизов',4],['events','Журнал сервиса',5]],user:[['account','Мой ID',0],['connections','Связи по ID',1],['subscription','Подписка',2],['exchange','Проверка связи',3]]};
const titles={overview:['Мост, а не хранилище','Маршрутизация между браузерами без содержимого данных'],accounts:['Обезличенные ID','Никаких имён, email или пользовательских досок'],orders:['Платежи и доступ','Событие оплаты меняет доступ, создание заказа — нет'],relay:['Транспорт','Передача только подключённому получателю, без очереди'],catalog:['Каталог релизов','Серверная конфигурация · проверка и установка остаются в приложении'],events:['Журнал сервиса','Только служебные события, без содержимого обмена'],account:['Ваш публичный ID','Связи с другими пользователями — только по ID'],connections:['Связи по ID','Приглашение и согласие второй стороны'],subscription:['Подписка','Платежи и результат проверки доступа'],exchange:['Проверка связи','Тест маршрута, не редактор пользовательских данных']};
function render(){document.body.classList.toggle('light',db.theme==='light');document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('on',b.dataset.role===db.role));$('#scope').textContent=db.role==='admin'?'Сервис SHELTER':'Личный кабинет';$('#identity').textContent=db.role==='admin'?'Администратор':db.client;$('#nav').innerHTML=menus[db.role].map(([id,t,i])=>`<button data-page="${id}" class="${page===id?'active':''}"><span class="navicon"><svg viewBox="0 0 24 24">${icons[i]}</svg></span>${t}</button>`).join('');$('#title').textContent=titles[page][0];$('#subtitle').textContent=titles[page][1];$('#client-controls').innerHTML=db.role==='user'?`<div class="client-switch"><span>Стенд: два независимых клиента</span><select id="client" aria-label="Активный демо-клиент"><option value="${A}" ${db.client===A?'selected':''}>Клиент 1 · ${A}</option><option value="${B}" ${db.client===B?'selected':''}>Клиент 2 · ${B}</option></select><span>Переключите клиента, чтобы принять приглашение второй стороной.</span></div>`:'';$('#view').innerHTML=({overview,accounts,orders,relay:transport,catalog,events,account,connections,subscription,exchange})[page]();}
function overview(){return `<div class="stats">${stat('Подключено ID',Object.values(db.presence).filter(Boolean).length,'Из '+db.accounts.length+' демо-ID')}${stat('Подтверждённые связи',db.links.filter(l=>l.status==='active').length,'Только после согласия получателя')}${stat('Доставлено',db.relay.delivered,'Тестовых сигналов за сеанс')}${stat('Сохранено тел',0,'Нет очереди и архива обмена')}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>Граница клиента и сервера</h2>${badge('Без хранения','ok')}</div>${rows([['Браузер-клиент','Данные, контакты, ключи'],['Сервер-мост','Связи ID → ID и доставка'],['Получатель не в сети','Отказ, повторяет клиент'],['Данные в обработке',db.relay.inflight+' байт'],['Очередь / архив','Отсутствуют']])}<p class="help" style="margin-top:18px">Локальные подписи контактов из UI браузера не передаются в эту панель. Мосту нужен адрес получателя, а не его имя.</p></section><section class="panel"><div class="panel-head"><h2>Проверка доступа</h2><button data-action="verification">${db.verificationAvailable?'Симулировать сбой':'Восстановить'}</button></div>${rows([['Проверка оплаты',db.verificationAvailable?badge('Доступна','ok'):badge('Недоступна','warn')],['Активных подписок',db.accounts.filter(x=>entitlement(x).active).length],['Оплачено заказов',db.orders.filter(o=>o.status==='paid').length],['Выручка',rub(db.orders.filter(o=>o.status==='paid').reduce((s,o)=>s+o.amount,0))]])}<p class="help" style="margin-top:18px">Любая ошибка проверки означает «доступ не подтверждён». Никакого доверия локальному флагу Premium.</p></section></div><section class="panel"><div class="panel-head"><h2>Последние события</h2><button data-page="events">Все события</button></div>${activity()}</section>`;}
function accounts(){return `<div class="toolbar"><input id="search" placeholder="Поиск по ID" value="${esc(search)}" aria-label="Поиск по ID"></div><section class="panel table-wrap"><table><thead><tr><th>Публичный ID</th><th>Соединение</th><th>Подписка</th><th class="num">Оплаченных заказов</th><th>Первый платёж</th></tr></thead><tbody>${db.accounts.filter(x=>x.includes(search.toUpperCase())).map(id=>`<tr><td class="id">${id}</td><td>${badge(db.presence[id]?'Подключён':'Отключён',db.presence[id]?'ok':'')}</td><td>${badge(entitlement(id).active?'Premium':'Не подтверждена',entitlement(id).active?'ok':'')}</td><td class="num">${paidOrders(id).length}</td><td>${date(paidOrders(id)[0]?.paidAt)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ID не найден</td></tr>'}</tbody></table></section><p class="help">Оплаченные заказы и первый платёж вычисляются из заказов. Публичный ID — псевдоним, а не гарантия полной анонимности: мост видит маршруты соединений.</p>`;}
function orderTable(list,canManage){return `<div class="table-wrap"><table><thead><tr><th>Заказ / дата</th>${canManage?'<th>ID</th>':''}<th>Тариф</th><th class="num">Сумма</th><th>Состояние</th>${canManage?'<th>Действия</th>':''}</tr></thead><tbody>${list.map(o=>`<tr><td>${esc(o.id)}<small>${date(o.created)}</small></td>${canManage?`<td class="id">${o.user}</td>`:''}<td>${planLabel(o.plan)}</td><td class="num">${rub(o.amount)}</td><td>${orderBadge(o.status)}</td>${canManage?`<td>${o.status==='pending'?`<button class="primary" data-action="pay" data-id="${o.id}">Демо-webhook</button>`:o.status==='paid'?`<button data-action="replay" data-id="${o.id}">Повтор события</button> <button data-action="refund" data-id="${o.id}">Возврат</button>`:'—'}</td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="empty">Заказов нет</td></tr>'}</tbody></table></div>`;}
function orders(){return `<div class="toolbar"><select id="filter" aria-label="Фильтр заказов">${[['all','Все заказы'],['pending','Ожидают оплаты'],['paid','Оплачены'],['refunded','Возвращены']].map(([v,t])=>`<option value="${v}" ${v===filter?'selected':''}>${t}</option>`).join('')}</select></div><section class="panel">${orderTable(db.orders.filter(o=>filter==='all'||o.status===filter),true)}</section><section class="panel"><h2>Контроль доступа</h2>${db.accounts.map(id=>`<div class="row"><span class="id">${id}</span><div>${badge(entitlement(id).active?'Premium':'Не подтверждён',entitlement(id).active?'ok':'')} <button class="danger" data-action="revoke" data-id="${id}" ${!entitlement(id).active?'disabled':''}>Отозвать доступ</button></div></div>`).join('')}</section><p class="help">Демо-webhook имитирует уже проверенное событие провайдера. Ключей и реальной оплаты в файле нет. Повтор одного события не продлевает доступ.</p>`;}
function account(){const s=entitlement(db.client);return `<div class="grid"><section class="panel"><div class="panel-head"><h2>ID для связи</h2>${badge('Публичный идентификатор')}</div><div class="hero-id id">${db.client}</div><p class="muted">Передайте этот ID другому пользователю. Имя контакта и его локальная подпись остаются в браузере.</p><div class="actions" style="margin-top:24px"><button class="primary" data-page="connections">Управлять связями</button></div></section><section class="panel"><h2>Состояние аккаунта</h2>${rows([['Соединение',db.presence[db.client]?badge('Подключён','ok'):badge('Отключён')],['Связей',db.links.filter(l=>l.status==='active'&&[l.from,l.to].includes(db.client)).length],['Подписка',s.active?badge('Premium','ok'):badge('Не подтверждена')],['До',date(s.expiresAt)]])}<button style="margin-top:18px" data-page="subscription">Управлять подпиской</button></section></div><section class="panel"><h2>Что остаётся в браузере</h2><p class="muted" style="margin-top:14px">Ваши задачи, доски, локальная адресная книга и ключи. В этой серверной демоверсии нет их редактора, копии или экспорта. Проверка обновлений также выполняется в приложении.</p></section>`;}
function connections(){const list=db.links.filter(l=>[l.from,l.to].includes(db.client));return `<div class="grid"><section class="panel"><h2>Связать по ID</h2><form id="invite-form" class="form" style="margin-top:20px"><label>ID получателя<input name="target" placeholder="SH-XXXX-XXXX" maxlength="12" required autocomplete="off" pattern="SH-[A-Z2-9]{4}-[A-Z2-9]{4}"></label><button class="primary">Отправить запрос связи</button></form><p class="help" style="margin-top:16px">Для теста используйте ID другого клиента: <span class="id">${db.client===A?B:A}</span>. Подтвердить запрос может только получатель.</p></section><section class="panel"><h2>Связи вашего ID</h2>${list.map(l=>{const peer=l.from===db.client?l.to:l.from;return `<div class="row"><div class="id">${peer}<small style="display:block">${l.status==='active'?'Подтверждена':l.to===db.client?'Входящий запрос':'Ожидается согласие'}</small></div><div class="actions">${l.status==='pending'&&l.to===db.client?`<button class="primary" data-action="accept" data-id="${l.id}">Принять</button>`:''}<button data-action="remove-link" data-id="${l.id}">${l.status==='active'?'Разорвать':'Отклонить / отменить'}</button></div></div>`;}).join('')||'<div class="empty">Нет связей или приглашений</div>'}</section></div><p class="help">После разрыва связи доставка между этими ID отклоняется. Добавление по ID не раскрывает администратору имя пользователя.</p>`;}
function exchange(){const peers=db.links.filter(l=>l.status==='active'&&[l.from,l.to].includes(db.client)).map(l=>l.from===db.client?l.to:l.from);return `<section class="panel"><div class="panel-head"><h2>Проверить маршрут</h2>${badge('Без пользовательских данных')}</div><div class="bridge"><div class="node"><b class="id">${db.client}</b><small>Отправитель</small></div><span class="arrow">→</span><div class="node server"><b>SHELTER</b><small>Пропускает, не сохраняет</small></div><span class="arrow">→</span><div class="node"><b>ID получателя</b><small>Только подтверждённая связь</small></div></div><form id="relay-form" class="form"><label>Получатель<select name="target" ${peers.length?'':'disabled'}>${peers.map(id=>`<option>${id}</option>`).join('')||'<option>Нет подтверждённых связей</option>'}</select></label><button class="primary" ${peers.length?'':'disabled'}>Отправить тестовый сигнал</button></form><p class="help" style="margin-top:18px">Вместо содержимого передаётся синтетический блок из 256 байт. Он создаётся и очищается в одном вызове. Это тест маршрута, не реализация E2EE или CRDT. После доставки остаётся лишь квитанция с ID, размером и временем.</p></section><div class="grid"><section class="panel"><h2>Подключение этого клиента</h2>${rows([['Ваш ID',db.client],['Соединение',db.presence[db.client]?badge('Подключён','ok'):badge('Отключён')]])}<button style="margin-top:18px" data-action="presence">${db.presence[db.client]?'Отключить этот клиент':'Подключить этот клиент'}</button><p class="help" style="margin-top:14px">Отключите клиент 2, переключитесь на клиент 1 и отправьте сигнал. Мост откажет в доставке: данные не сохраняются в ожидании получателя.</p></section><section class="panel"><h2>Последняя квитанция этого ID</h2>${db.lastDelivery&&[db.lastDelivery.from,db.lastDelivery.to].includes(db.client)?rows([['Отправитель',db.lastDelivery.from],['Получатель',db.lastDelivery.to],['Объём',db.lastDelivery.bytes+' байт'],['Доставлено',date(db.lastDelivery.at)],['Тело после доставки','Отсутствует']]):'<div class="empty">Успешной доставки пока нет</div>'}</section></div>`;}
function transport(){return `<div class="stats">${stat('Попытки',db.relay.attempts,'За текущий сеанс')}${stat('Доставлено',db.relay.delivered,'Только подключённому получателю')}${stat('Отклонено',db.relay.rejected,'Нет связи или получатель отключён')}${stat('В очереди',0,'Очередь не создаётся')}</div><section class="panel"><div class="panel-head"><h2>Активные маршруты</h2>${badge('Только ID')}</div><div class="table-wrap"><table><thead><tr><th>Отправитель</th><th>Получатель</th><th>Состояние связи</th></tr></thead><tbody>${db.links.filter(l=>l.status==='active').map(l=>`<tr><td class="id">${l.from}</td><td class="id">${l.to}</td><td>${badge('Подтверждена','ok')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Маршрутов нет. Создайте связь в панели пользователя.</td></tr>'}</tbody></table></div></section><section class="panel"><h2>Политика моста</h2>${rows([['Тела сообщений на диске','Не хранятся'],['Тела сообщений в демосостоянии','Отсутствуют'],['Данные в обработке',db.relay.inflight+' байт'],['Неподключённый получатель','Отказ, без постановки в очередь'],['Имена и локальные контакты','Не передаются мосту']])}<p class="help" style="margin-top:18px">ID, согласия связей и биллинг — служебные данные. Маршруты позволяют видеть факт связи, поэтому это псевдонимная, а не полностью анонимная система. В реальном сервисе нужны аутентификация владельца ID и согласованная политика удаления метаданных.</p></section>`;}
function subscription(){const s=entitlement(db.client);return `<section class="panel"><div class="panel-head"><h2>Доступ для ${db.client}</h2>${badge(s.active?'Premium':'Не подтверждён',s.active?'ok':'')}</div>${rows([['Результат проверки',s.reason==='verification_unavailable'?'Ошибка проверки → доступ закрыт':s.reason==='revoked'?'Отозван администратором':s.active?'Подтверждена оплата (демо)':'Нет активной подписки'],['Действует до',date(s.expiresAt)],['Оплаченных заказов',paidOrders(db.client).length],['Первый платёж',date(paidOrders(db.client)[0]?.paidAt)]])}<button style="margin-top:18px" data-action="verification">${db.verificationAvailable?'Симулировать ошибку проверки':'Восстановить проверку'}</button></section><div class="plans">${Object.entries(plans).map(([id,p])=>`<section class="panel"><h2>Premium · ${p.name}</h2><div class="price">${rub(p.amount)} <small>/ ${p.days} дней</small></div><p class="muted">Демонстрация оплаты, без реального списания.</p><button class="primary" data-action="checkout" data-id="${id}" style="margin-top:20px">Создать демо-заказ</button></section>`).join('')}</div><section class="panel"><h2 style="margin-bottom:20px">Заказы этого ID</h2>${orderTable(db.orders.filter(o=>o.user===db.client),false)}</section><p class="help">Подтвердите заказ из панели администратора → «Платежи и доступ» → «Демо-webhook». Подписка рассчитывается из оплаченных заказов; локальные флаги не являются доказательством оплаты.</p>`;}
function numeric(v){return /^v?\d+\.\d+\.\d+$/.test(v);}
function catalog(){return `<section class="panel"><div class="panel-head"><h2>Метаданные релизов</h2><button data-action="release">Добавить демо-запись</button></div><p class="muted">Сервер публикует каталог, браузер сам проверяет версию по кнопке в приложении. В пользовательской панели этого раздела нет.</p>${db.releases.map(r=>`<div class="row"><div><h3>v${esc(r.version)} ${badge(r.channel)}</h3><small>${esc(r.notes)}</small></div><small>${date(r.published)}</small></div>`).join('')}<p class="help" style="margin-top:16px">Записи вымышлены и не загружаются с GitHub. Нет скачивания или установки обновлений.</p></section><section class="panel"><h2>Конфигурация ответа клиенту</h2><form id="catalog-form" class="form" style="margin-top:20px"><div class="fields"><label>Канал по умолчанию<select name="channel"><option ${db.channel==='stable'?'selected':''}>stable</option><option ${db.channel==='beta'?'selected':''}>beta</option></select></label><label>Минимальная поддерживаемая версия<input name="min" value="${esc(db.min)}" required></label></div><button class="primary">Сохранить демо-конфигурацию</button></form><p class="help" style="margin-top:18px">Только X.Y.Z / vX.Y.Z; autoInstall всегда false. Bridge-контракты браузера не изменяются.</p></section>`;}
function events(){return `<section class="panel"><div class="panel-head"><h2>Служебные события</h2>${badge('В памяти · последние 60')}</div><p class="help" style="margin-bottom:16px">Здесь только тип операции, служебный ID и время. Нет содержимого пакетов, задач, имён, URL и секретов. При закрытии или перезагрузке файла журнал исчезает.</p>${activity(60)}</section>`;}
function modal(title,body,submit){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-form').onsubmit=e=>{e.preventDefault();try{submit(new FormData(e.target));$('#modal').close();render();}catch(err){toast(err.message);}};$('#modal').showModal();}
function confirmAction(title,text,fn){modal(title,`<p class="muted">${esc(text)}</p>`,fn);}
function action(a,id){try{if(['pay','replay','refund','revoke','release'].includes(a))admin();if(['accept','remove-link','presence','checkout'].includes(a))user();
if(a==='accept'){acceptLink(id);toast('Связь подтверждена обеими сторонами');}
if(a==='remove-link'){removeLink(id);toast('Связь удалена, доставка больше не разрешена');}
if(a==='presence'){db.presence[db.client]=!db.presence[db.client];log('connection.changed',db.client+(db.presence[db.client]?' подключён':' отключён'));}
if(a==='verification'){db.verificationAvailable=!db.verificationAvailable;log('verification.changed',db.verificationAvailable?'Проверка доступа восстановлена':'Ошибка проверки: доступ не подтверждается');}
if(a==='checkout'){checkout(id);toast('Заказ ожидает оплаты. Подтвердите демо-webhook в панели администратора.');}
if(a==='pay'||a==='replay'){const processed=paymentWebhook(id);toast(processed?'Демо-оплата подтверждена':'Повторное событие проигнорировано. Срок доступа не изменился.');}
if(a==='refund'){confirmAction('Вернуть платёж?','Демонстрация возврата. Доступ будет пересчитан по остальным оплаченным заказам.',()=>{admin();const o=db.orders.find(o=>o.id===id);if(!o||o.status!=='paid')throw Error('Возврат недоступен');o.status='refunded';log('payment.refunded','Возврат: '+o.id);});return;}
if(a==='revoke'){confirmAction('Отозвать доступ?','Служебный запрет доступа не изменяет историю платежей.',()=>{admin();if(!db.revoked.includes(id))db.revoked.push(id);log('subscription.revoked','Доступ отозван: '+id);});return;}
if(a==='release'){modal('Демо-запись каталога','<div class="form"><label>Числовая версия<input name="version" placeholder="1.5.0" maxlength="32" required></label><label>Канал<select name="channel"><option>stable</option><option>beta</option></select></label><label>Примечание<input name="notes" maxlength="200" required></label></div>',f=>{admin();const v=String(f.get('version'));if(!numeric(v))throw Error('Только числовая версия X.Y.Z или vX.Y.Z');const n=v.replace(/^v/,'');if(db.releases.some(r=>r.version===n))throw Error('Версия уже добавлена');db.releases.unshift({version:n,channel:f.get('channel'),notes:f.get('notes'),published:now()});log('catalog.updated','Добавлена демонстрационная версия v'+n);});return;}
render();}catch(e){toast(e.message);render();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.role){db.role=b.dataset.role;page=db.role==='admin'?'overview':'account';search='';filter='all';render();}else if(b.dataset.page){if(!menus[db.role].some(x=>x[0]===b.dataset.page))return;page=b.dataset.page;render();}else if(b.dataset.action)action(b.dataset.action,b.dataset.id);});
document.addEventListener('change',e=>{if(e.target.id==='client'){if(![A,B].includes(e.target.value))return;db.client=e.target.value;render();}if(e.target.id==='filter'){filter=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;$('#view').innerHTML=accounts();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('submit',e=>{const id=e.target.id;if(!['invite-form','relay-form','catalog-form'].includes(id))return;e.preventDefault();const f=new FormData(e.target);try{if(id==='invite-form'){requestLink(f.get('target'));toast('Запрос отправлен. Переключитесь на клиент получателя и примите приглашение.');}if(id==='relay-form'){relay(f.get('target'));toast('Тестовый сигнал доставлен. Тело очищено, очередь пуста.');}if(id==='catalog-form'){admin();const v=String(f.get('min'));if(!numeric(v))throw Error('Только числовая версия X.Y.Z');db.min=v.replace(/^v/,'');db.channel=f.get('channel');log('catalog.configured','Обновлена конфигурация каталога');toast('Демо-конфигурация сохранена');}render();}catch(err){toast(err.message);if(id==='relay-form')render();}});
$('#theme').onclick=()=>{db.theme=db.theme==='light'?'dark':'light';render();};$('#cancel').onclick=()=>$('#modal').close();$('#reset').onclick=()=>confirmAction('Начать заново?','Все связи, заказы и служебные события текущего сеанса будут сброшены.',()=>{db=seed();page='overview';search='';filter='all';});render();
</script></html>
