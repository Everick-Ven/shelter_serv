<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHELTER — серверная демоверсия</title>
<style>
:root{color-scheme:dark;--bg:#08080a;--surface:#0e0e10;--card:#141417;--hover:#232327;--line:#ffffff12;--ink:#f2f2f5;--muted:#9fa0a8;--accent:#a8b8e0;--green:#53d4a2;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit;color:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 14px}button:hover{background:var(--hover)}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--accent);color:#11131a;border-color:transparent}input,select{background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:8px;max-width:100%}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.04em;font-weight:550}h2{font-size:18px;letter-spacing:-.025em;font-weight:550}h3{font-size:15px;font-weight:550}small,.muted{color:var(--muted)}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--surface)}.logo{font-weight:650;letter-spacing:.08em;display:flex;gap:10px;align-items:center}.logo svg{width:22px}.address{margin:auto;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:5px 22px;border-radius:7px;font-size:12px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 58px)}aside{padding:26px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}.scope{padding:0 12px}.scope b{display:block;font-size:16px}.scope small{font-size:12px}nav{display:grid;gap:5px}nav button{border:0;text-align:left;background:transparent;color:var(--muted);display:flex;gap:12px;padding:12px}nav button.active{background:var(--hover);color:var(--ink)}.navicon{width:18px;height:18px;display:inline-flex}svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.aside-bottom{margin-top:auto;padding:12px;color:var(--muted);font-size:12px}.online{color:var(--green)}main{padding:34px 42px;max-width:1600px;width:100%;margin:auto;align-self:start}.heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:26px}.heading p{margin-top:5px;color:var(--muted)}.notice{padding:12px 16px;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin-bottom:26px;background:var(--surface);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:20px}.stat strong{display:block;font-size:32px;letter-spacing:-.04em;font-weight:500;margin:12px 0 4px}.stat small{font-size:12px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.panel{padding:22px;margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.rows{display:grid;gap:0}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--muted)}.row b{font-weight:500}.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--hover);color:var(--muted)}.badge.ok{color:var(--green);background:#53d4a212}.badge.warn{color:#e8be79;background:#e8be7912}.badge.bad{color:var(--red);background:#ff858512}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-weight:400;font-size:12px;padding:0 12px 14px}td{padding:16px 12px;border-top:1px solid var(--line)}td small{display:block}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.bars{height:150px;display:flex;gap:12px;align-items:end;margin-top:25px}.bar{flex:1;background:#a8b8e025;border-top:2px solid var(--accent);position:relative;min-height:4px}.bar small{position:absolute;top:100%;margin-top:8px;width:100%;text-align:center;font-size:11px}.chart{padding-bottom:32px}.event{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}.event i{width:6px;height:6px;background:var(--accent);border-radius:50%;margin-top:8px;flex-shrink:0}.event small{display:block}.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}.price{font-size:32px;letter-spacing:-.04em;margin:18px 0}.price small{font-size:14px;letter-spacing:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.form{display:grid;gap:16px}.form label{display:grid;gap:7px;color:var(--muted)}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.column{background:var(--surface);padding:16px;border-radius:12px}.task{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:16px;margin-top:12px}.task p{margin:10px 0}.task select{width:100%;font-size:12px}.empty{padding:32px;text-align:center;color:var(--muted)}pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:auto;padding:18px;font-size:12px;color:#b7c3dc;white-space:pre-wrap;word-break:break-word}.flow{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted)}.flow b{padding:12px;background:var(--surface);border-radius:8px;color:var(--ink);font-weight:450;flex:1;text-align:center}.progress{height:4px;background:var(--hover);margin:16px 0;border-radius:3px}.progress i{display:block;height:100%;background:var(--accent);width:65%}dialog{color:var(--ink);background:var(--card);border:1px solid #ffffff24;border-radius:16px;padding:28px;width:500px;max-width:92vw}dialog::backdrop{background:#0009;backdrop-filter:blur(5px)}dialog h2{margin-bottom:20px}dialog .actions{margin-top:24px;justify-content:flex-end}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 20px;z-index:10;max-width:90vw}[hidden]{display:none!important}.role-switch{display:flex;gap:3px;border:1px solid var(--line);padding:3px;border-radius:9px}.role-switch button{font-size:12px;padding:5px 11px;border:0;background:transparent;color:var(--muted)}.role-switch button.on{background:var(--hover);color:var(--ink)}.light{color-scheme:light;--bg:#e4e8ee;--surface:#f4f6f9;--card:#fff;--hover:#e5e9ef;--line:#14264216;--ink:#0e141f;--muted:#606770;--accent:#4267b2;--green:#16835c;--red:#c94747}.light pre{color:#4267b2}@media(max-width:1000px){main{padding:26px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.shell{grid-template-columns:190px 1fr}.address{display:none}}@media(max-width:680px){header{padding:0 12px;gap:12px}.logo{font-size:12px}.shell{display:block}aside{padding:16px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.scope,.aside-bottom{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}.navicon{display:none}main{padding:22px 16px}.heading{align-items:start}h1{font-size:24px}.plans,.kanban{grid-template-columns:1fr}.flow{flex-wrap:wrap}.stat{padding:16px}.stat strong{font-size:27px}.heading .actions{justify-content:end}header>button{padding:7px}}
</style>
<header><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 21 6v6c0 5-5 9-9 10-4-1-9-5-9-10V6Z"/><path d="m8 12 3 3 5-6"/></svg>SHELTER</div><div class="address">shelter://server-demo</div><div class="role-switch"><button data-role="admin">Администратор</button><button data-role="user">Пользователь</button></div><button id="theme" title="Сменить тему" aria-label="Сменить тему">◐</button></header>
<div class="shell"><aside><div class="scope"><b id="scope"></b><small id="identity"></small></div><nav id="nav"></nav><div class="aside-bottom"><span class="online">● Автономная демоверсия</span><p style="margin:10px 0">Все данные — примеры.<br>Ничего не отправляется в сеть.</p><button id="reset">Сбросить демо</button></div></aside><main><div class="heading"><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="actions"><button id="export">Экспорт JSON</button></div></div><div class="notice">Демонстрация серверной логики · локальные данные, не реальная авторизация или оплата. Для проверки сценария переключайте роли справа вверху.</div><div id="view"></div></main></div>
<dialog id="modal"><h2 id="modal-title"></h2><form id="modal-form"><div id="modal-body"></div><div class="actions"><button type="button" id="cancel">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s),KEY='shelter:server-demo:v1',now=()=>new Date().toISOString(),uid=()=>Math.random().toString(36).slice(2,10),rub=n=>(n/100).toLocaleString('ru-RU')+' ₽',date=d=>d?new Date(d).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){const t=Date.now();return {version:1,role:'admin',theme:'dark',users:[{id:'u1',name:'Александр Волков',email:'alex@example.test',role:'user',joined:new Date(t-28*864e5).toISOString()},{id:'u2',name:'Мария Соколова',email:'maria@example.test',role:'user',joined:new Date(t-15*864e5).toISOString()},{id:'u3',name:'Денис Орлов',email:'denis@example.test',role:'user',joined:new Date(t-8*864e5).toISOString()}],orders:[{id:'ord_demo_01',user:'u2',plan:'year',amount:239000,status:'paid',created:new Date(t-5*864e5).toISOString(),paidAt:new Date(t-5*864e5).toISOString()},{id:'ord_demo_02',user:'u3',plan:'month',amount:29900,status:'paid',created:new Date(t-2*864e5).toISOString(),paidAt:new Date(t-2*864e5).toISOString()}],subscriptions:{u2:{expires:new Date(t+360*864e5).toISOString(),plan:'year'},u3:{expires:new Date(t+28*864e5).toISOString(),plan:'month'}},tasks:[{id:'t1',title:'Обновить макеты главной страницы',project:'SHELTER',priority:'Высокий',status:'todo',due:'Сегодня'},{id:'t2',title:'Проверить сценарий синхронизации',project:'SHELTER',priority:'Высокий',status:'doing',due:'Завтра'},{id:'t3',title:'Подготовить заметки к релизу',project:'Продукт',priority:'Обычный',status:'done',due:'Сегодня'}],releases:[{version:'1.4.0',channel:'stable',notes:'Улучшена синхронизация досок и восстановление соединения.',created:now()},{version:'1.5.0',channel:'beta',notes:'Новый календарь задач и улучшения фокус-сессий.',created:now()}],events:[{time:now(),type:'demo.initialized',text:'Загружен демонстрационный набор данных'}],envelopes:[],revision:0,serverRevision:0,channel:'stable',min:'1.2.0',offline:false};}
let db;try{db=JSON.parse(localStorage.getItem(KEY));if(db?.version!==1)db=null;}catch{}db=db||seed();let page='overview',search='',filter='all',storageWarn=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch{if(!storageWarn){storageWarn=true;toast('Хранилище недоступно: данные сохраняются только до закрытия файла.');}}}
function log(type,text){db.events.unshift({time:now(),type,text});db.events=db.events.slice(0,100);save();}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3800);}
const plans={month:{name:'Месяц',days:30,amount:29900},year:{name:'Год',days:365,amount:239000}};
function requireAdmin(){if(db.role!=='admin')throw Error('Операция доступна только администратору');}
function status(id='u1'){if(db.offline)return {active:false,reason:'verification_unavailable'};const s=db.subscriptions[id];return {active:!!s&&new Date(s.expires)>new Date(),reason:s&&new Date(s.expires)>new Date()?'active':'no_subscription',planId:s?.plan||null,expiresAt:s?.expires||null};}
function badge(s){const names={paid:'Оплачен',pending:'Ожидает оплаты',refunded:'Возвращён',active:'Premium',none:'Без подписки',todo:'Входящие',doing:'В работе',done:'Готово'};return '<span class="badge '+(['paid','active','done'].includes(s)?'ok':s==='pending'?'warn':s==='refunded'?'bad':'')+'">'+(names[s]||esc(s))+'</span>';}
const icons=['<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>','<circle cx="10" cy="8" r="4"/><path d="M3 21v-3a7 7 0 0 1 14 0v3m1-17a4 4 0 0 1 0 8m2 4 2 5"/>','<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18m-14 5h4"/>','<path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/>','<path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/>','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'];
const menus={admin:[['overview','Обзор',0],['users','Пользователи',1],['orders','Платежи и заказы',2],['sync','Обмен данными',3],['updates','Обновления',4],['events','Журнал событий',5]],user:[['home','Мой аккаунт',0],['tasks','Задачи',1],['subscription','Подписка',2],['sync','Синхронизация',3],['updates','Обновления',4]]};
function render(){document.body.classList.toggle('light',db.theme==='light');document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('on',b.dataset.role===db.role));$('#scope').textContent=db.role==='admin'?'Управление проектом':'Личное пространство';$('#identity').textContent=db.role==='admin'?'Администратор SHELTER':'Александр Волков';$('#nav').innerHTML=menus[db.role].map(([id,label,i])=>`<button data-page="${id}" class="${id===page?'active':''}"><span class="navicon"><svg viewBox="0 0 24 24">${icons[i]}</svg></span>${label}</button>`).join('');const names={overview:['Обзор','Состояние проекта и последние события'],users:['Пользователи','Аккаунты и доступ к Premium'],orders:['Платежи и заказы','Оплата подтверждается только событием провайдера'],sync:[db.role==='admin'?'Обмен данными':'Синхронизация','Доски задач · модель доставки конвертов'],updates:['Обновления','Проверка версии без автоматической установки'],events:['Журнал событий','Последовательность операций в демоверсии'],home:['С возвращением, Александр','Ваш аккаунт, задачи и рабочие пространства'],tasks:['Задачи','Доска проекта · Личное пространство'],subscription:['Подписка','Доступ и история ваших платежей']};$('#title').textContent=names[page][0];$('#subtitle').textContent=names[page][1];const f={overview,users,orders,sync,updates,events,home,tasks,subscription};$('#view').innerHTML=f[page]();save();}
function stat(label,value,sub){return `<div class="stat"><span class="muted">${label}</span><strong>${value}</strong><small>${sub}</small></div>`;}
function rows(a){return '<div class="rows">'+a.map(([l,v])=>`<div class="row"><span>${l}</span><b>${v}</b></div>`).join('')+'</div>';}
function activity(limit=6){return db.events.slice(0,limit).map(e=>`<div class="event"><i></i><div>${esc(e.text)}<small>${esc(e.type)} · ${date(e.time)}</small></div></div>`).join('');}
function overview(){const paid=db.orders.filter(o=>o.status==='paid'),revenue=paid.reduce((s,o)=>s+o.amount,0);return `<div class="stats">${stat('Пользователи',db.users.length,'В демонстрационном проекте')}${stat('Активный Premium',db.users.filter(u=>status(u.id).active).length,'Проверяется по сроку доступа')}${stat('Выручка',rub(revenue),'Только оплаченные заказы')}${stat('Конверты задач',db.envelopes.length,'Метаданные синхронизации')}</div><div class="grid"><section class="panel chart"><div class="panel-head"><h2>Оплаты за неделю</h2><span class="badge">Демо-данные</span></div><p class="muted">Подтверждённые платежи из заказов</p><div class="bars">${Array.from({length:7},(_,i)=>{const day=new Date(Date.now()-(6-i)*864e5);const n=paid.filter(o=>new Date(o.paidAt).toDateString()===day.toDateString()).reduce((s,o)=>s+o.amount,0);return `<div class="bar" style="height:${Math.max(3,n/239000*115)}px" title="${rub(n)}"><small>${day.toLocaleDateString('ru-RU',{weekday:'short'})}</small></div>`;}).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Сервисы</h2><button data-action="network">${db.offline?'Восстановить':'Сбой проверки'}</button></div>${rows([['Проверка подписки',db.offline?badge('none'):'<span class="online">Доступна · симуляция</span>'],['Канал релизов',esc(db.channel)],['Минимальная версия',esc(db.min)],['Автоустановка','Отключена']])}</section></div><section class="panel"><div class="panel-head"><h2>Последние события</h2><button data-page="events">Все события</button></div>${activity()}</section>`;}
function users(){return `<div class="toolbar"><input id="search" placeholder="Найти по имени или email" value="${esc(search)}" aria-label="Поиск пользователей"></div><section class="panel table-wrap"><table><thead><tr><th>Пользователь</th><th>Подписка</th><th class="num">Оплачено заказов</th><th>Первый платёж</th><th>Действие</th></tr></thead><tbody>${db.users.filter(u=>(u.name+' '+u.email).toLowerCase().includes(search.toLowerCase())).map(u=>{const paid=db.orders.filter(o=>o.user===u.id&&o.status==='paid').sort((a,b)=>a.paidAt.localeCompare(b.paidAt));return `<tr><td>${esc(u.name)}<small>${esc(u.email)}</small></td><td>${badge(status(u.id).active?'active':'none')}</td><td class="num">${paid.length}</td><td>${date(paid[0]?.paidAt)}</td><td><button data-action="revoke" data-id="${u.id}" ${!db.subscriptions[u.id]?'disabled':''}>Отозвать доступ</button></td></tr>`;}).join('')||'<tr><td colspan="5" class="empty">Ничего не найдено</td></tr>'}</tbody></table></section>`;}
function orderTable(list,admin){return `<div class="table-wrap"><table><thead><tr><th>Заказ / дата</th>${admin?'<th>Пользователь</th>':''}<th>Тариф</th><th class="num">Сумма</th><th>Статус</th>${admin?'<th>Действие</th>':''}</tr></thead><tbody>${list.map(o=>`<tr><td>${esc(o.id)}<small>${date(o.created)}</small></td>${admin?`<td>${esc(db.users.find(u=>u.id===o.user)?.name)}</td>`:''}<td>${plans[o.plan].name}</td><td class="num">${rub(o.amount)}</td><td>${badge(o.status)}</td>${admin?`<td>${o.status==='pending'?`<button class="primary" data-action="pay" data-id="${o.id}">Демо-webhook</button>`:o.status==='paid'?`<button data-action="refund" data-id="${o.id}">Возврат</button>`:'—'}</td>`:''}</tr>`).join('')||`<tr><td colspan="6" class="empty">Заказов пока нет. Выберите тариф, чтобы начать демонстрацию.</td></tr>`}</tbody></table></div>`;}
function orders(){return `<div class="toolbar"><select id="filter" aria-label="Статус заказа">${[['all','Все заказы'],['pending','Ожидают оплаты'],['paid','Оплачены'],['refunded','Возвращены']].map(([v,t])=>`<option value="${v}" ${v===filter?'selected':''}>${t}</option>`).join('')}</select></div><div class="panel">${orderTable(db.orders.filter(o=>filter==='all'||o.status===filter),true)}</div><p class="muted">Создайте заказ в роли пользователя, затем здесь подтвердите его демо-webhook. Повторная доставка не продлевает подписку.</p>`;}
function home(){const s=status();return `<div class="stats">${stat('Задачи',db.tasks.length,'В личном пространстве')}${stat('Завершено',db.tasks.filter(t=>t.status==='done').length,'На доске проекта')}${stat('Подписка',s.active?'Premium':'Базовая',s.active?'до '+date(s.expiresAt):'Доступ не подтверждён')}${stat('Синхронизация',db.offline?'Нет связи':db.revision===db.serverRevision?'Актуально':'Есть изменения','Локальная модель обмена')}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>Ваш рабочий день</h2><button data-page="tasks">Открыть доску</button></div>${db.tasks.map(t=>`<div class="row"><div><p>${esc(t.title)}</p><small>${esc(t.project)} · ${esc(t.due)}</small></div>${badge(t.status)}</div>`).join('')}</section><section class="panel"><h2>Аккаунт</h2>${rows([['Имя','Александр Волков'],['Email','alex@example.test'],['Роль','Пользователь'],['Пространство','Личное']])}<div class="actions" style="margin-top:20px"><button data-page="subscription">Управление подпиской</button></div></section></div>`;}
function subscription(){const s=status();return `<div class="panel"><div class="panel-head"><h2>Ваш доступ</h2>${badge(s.active?'active':'none')}</div>${rows([['Результат проверки',s.active?'Доступ подтверждён (демо)':db.offline?'Ошибка связи → доступ не подтверждён':'Нет активной подписки'],['Действует до',date(s.expiresAt)],['Оплачено заказов',db.orders.filter(o=>o.user==='u1'&&o.status==='paid').length]])}<div class="actions" style="margin-top:18px"><button data-action="network">${db.offline?'Восстановить связь':'Симулировать ошибку проверки'}</button></div></div><div class="plans">${Object.entries(plans).map(([id,p])=>`<section class="panel"><h2>Premium · ${p.name}</h2><div class="price">${rub(p.amount)} <small>/ ${p.days} дней</small></div><p class="muted">Демонстрация серверного цикла оплаты и доступа.</p><button class="primary" data-action="checkout" data-id="${id}" style="margin-top:24px">Создать демо-заказ</button></section>`).join('')}</div><div class="panel"><h2 style="margin-bottom:20px">История заказов</h2>${orderTable(db.orders.filter(o=>o.user==='u1'),false)}</div><p class="muted">Создание заказа не активирует Premium. Переключитесь на администратора → «Платежи и заказы» → «Демо-webhook».</p>`;}
function tasks(){return `<div class="toolbar"><button class="primary" data-action="new-task">Добавить задачу</button><button data-page="sync">Открыть синхронизацию</button><span class="muted" style="align-self:center">Локальная ревизия ${db.revision}</span></div><div class="kanban">${[['todo','Входящие'],['doing','В работе'],['done','Готово']].map(([id,name])=>`<section class="column"><div class="panel-head"><h3>${name}</h3><small>${db.tasks.filter(t=>t.status===id).length}</small></div>${db.tasks.filter(t=>t.status===id).map(t=>`<article class="task"><small>${esc(t.project)} · ${esc(t.priority)}</small><p>${esc(t.title)}</p><div class="row"><small>${esc(t.due)}</small><button data-action="delete-task" data-id="${t.id}" aria-label="Удалить задачу">×</button></div><select data-task="${t.id}" aria-label="Статус задачи">${[['todo','Входящие'],['doing','В работе'],['done','Готово']].map(([v,l])=>`<option value="${v}" ${v===id?'selected':''}>${l}</option>`).join('')}</select></article>`).join('')||'<div class="empty">Нет задач</div>'}</section>`).join('')}</div>`;}
function sync(){const admin=db.role==='admin';return `<div class="stats">${stat('Локальная ревизия',admin?'—':db.revision,admin?'Содержимое остаётся на клиенте':'Изменяется при редактировании задач')}${stat('Принято ревизий',db.serverRevision,'На демонстрационной стороне сервера')}${stat('Конверты',db.envelopes.length,'Только метаданные доставки')}${stat('Соединение',db.offline?'Нет связи':'Доступно','Симуляция сети')}</div><section class="panel"><h2>${admin?'Транспорт конвертов':'Доставка изменений между устройствами'}</h2><div class="flow"><b>Локальная доска</b>→<b>Конверт изменений</b>→<b>Ретранслятор</b>→<b>Второе устройство</b></div><p class="muted">Модель: CRDT/Yjs, ключи у участников, сервер хранит конверты и курсор доставки, а не текст задач. В этом файле шифрование и CRDT не реализованы: передаются только демонстрационные метаданные, текст задач остаётся в локальной модели UI.</p><div class="actions" style="margin-top:20px">${!admin?'<button class="primary" data-action="push">Отправить изменения</button><button data-action="pull">Проверить второе устройство</button>':''}<button data-action="network">${db.offline?'Восстановить связь':'Отключить связь'}</button></div></section><section class="panel"><div class="panel-head"><h2>Журнал доставки</h2><span class="badge">Содержимое скрыто</span></div><div class="table-wrap"><table><thead><tr><th>Конверт</th><th>Доска</th><th>Ревизия</th><th>Время</th><th>Состояние</th></tr></thead><tbody>${db.envelopes.map(e=>`<tr><td>${esc(e.id)}</td><td>board_demo</td><td>${e.revision}</td><td>${date(e.time)}</td><td>${badge('done')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Измените задачу и отправьте изменения из панели пользователя.</td></tr>'}</tbody></table></div></section>`;}
function updates(){return `<div class="grid"><section class="panel"><div class="panel-head"><h2>Проверка обновлений</h2><span class="badge">autoInstall: false</span></div><form id="check-form" class="form"><label>Текущая версия<input name="version" value="1.3.0" pattern="v?[0-9]+\.[0-9]+\.[0-9]+" required></label><label>Канал<select name="channel"><option>stable</option><option>beta</option></select></label><button class="primary">Проверить обновления</button></form><div id="check-result" style="margin-top:20px"><p class="muted">Результат проверки появится здесь. Установка не запускается.</p></div></section><section class="panel"><div class="panel-head"><h2>Канал публикации</h2>${db.role==='admin'?'<button data-action="release">Добавить демо-релиз</button>':''}</div>${rows([['Источник','GitHub Releases · демо-набор'],['Канал по умолчанию',esc(db.channel)],['Минимальная версия',esc(db.min)],['Установка','Только вручную']])}<p class="muted" style="margin-top:20px">Только числовые X.Y.Z или vX.Y.Z. Все версии здесь вымышлены; это не список реальных релизов браузера.</p></section></div><section class="panel"><h2 style="margin-bottom:20px">Демонстрационные релизы</h2>${db.releases.map(r=>`<div class="row"><div><h3>v${esc(r.version)} <span class="badge">${esc(r.channel)}</span></h3><p class="muted">${esc(r.notes)}</p></div><small>${date(r.created)}</small></div>`).join('')}</section>`;}
function events(){return `<section class="panel"><div class="panel-head"><h2>Операции демоверсии</h2><span class="badge">${db.events.length} событий</span></div>${activity(100)}</section>`;}
function modal(title,body,submit){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal-form').onsubmit=e=>{e.preventDefault();try{submit(new FormData(e.target));$('#modal').close();render();}catch(err){toast(err.message);}};$('#modal').showModal();}
function confirmAction(title,text,fn){modal(title,`<p class="muted">${esc(text)}</p>`,fn);}
function version(v){return /^v?\d+\.\d+\.\d+$/.test(v);}function compare(a,b){const x=a.replace(/^v/,'').split('.').map(Number),y=b.replace(/^v/,'').split('.').map(Number);for(let i=0;i<3;i++)if(x[i]!==y[i])return x[i]-y[i];return 0;}
function action(a,id){try{if(['new-task','delete-task','push','pull'].includes(a)&&db.role!=='user')throw Error('Операция доступна только пользователю');if(['pay','refund','revoke','release'].includes(a))requireAdmin();if(a==='network'){db.offline=!db.offline;log('network.simulated',db.offline?'Симуляция сбоя: проверка подписки закрыта':'Соединение восстановлено');render();return;}
if(a==='checkout'){if(db.role!=='user')throw Error('Заказ создаётся из панели пользователя');if(db.offline)throw Error('Сеть недоступна. Заказ не создан');const p=plans[id];if(!p)throw Error('Неизвестный тариф');db.orders.unshift({id:'ord_'+uid(),user:'u1',plan:id,amount:p.amount,status:'pending',created:now()});log('checkout.created','Создан заказ: '+p.name+', ожидает оплаты');render();toast('Заказ создан. Подтвердите демо-webhook в панели администратора.');}
if(a==='pay'){const o=db.orders.find(o=>o.id===id);if(!o||o.status!=='pending')throw Error('Событие уже обработано или заказ недоступен');if(db.offline)throw Error('Сеть недоступна');o.status='paid';o.paidAt=now();const base=Math.max(Date.now(),new Date(db.subscriptions[o.user]?.expires||0).getTime());db.subscriptions[o.user]={plan:o.plan,expires:new Date(base+plans[o.plan].days*864e5).toISOString()};log('payment.succeeded','Демо-webhook подтверждён: '+o.id);render();toast('Оплата подтверждена в симуляторе, срок доступа обновлён');}
if(a==='refund')confirmAction('Вернуть платёж?','Это демо-возврат. Заказ станет refunded, доступ пользователя будет отозван.',()=>{const o=db.orders.find(o=>o.id===id);if(!o||o.status!=='paid')throw Error('Заказ нельзя вернуть');o.status='refunded';delete db.subscriptions[o.user];log('payment.refunded','Возврат и отзыв доступа: '+id);});
if(a==='revoke')confirmAction('Отозвать доступ?','Платежи сохранятся в истории, но активная подписка будет отозвана.',()=>{delete db.subscriptions[id];log('subscription.revoked','Доступ отозван: '+id);});
if(a==='new-task')modal('Новая задача','<div class="form"><label>Название<input name="title" maxlength="120" required autofocus></label><label>Проект<input name="project" maxlength="50" value="SHELTER" required></label><label>Приоритет<select name="priority"><option>Обычный</option><option>Высокий</option></select></label></div>',f=>{if(!f.get('title').trim())throw Error('Введите название');db.tasks.push({id:uid(),title:f.get('title').trim(),project:f.get('project'),priority:f.get('priority'),status:'todo',due:'Без срока'});db.revision++;log('task.created','Локальная доска изменена');});
if(a==='delete-task'){db.tasks=db.tasks.filter(t=>t.id!==id);db.revision++;log('task.deleted','Локальная доска изменена');render();}
if(a==='push'){if(db.role!=='user')throw Error('Операция только для клиента');if(db.offline)throw Error('Нет связи. Изменения остались на устройстве');if(db.revision===db.serverRevision)throw Error('Новых изменений нет');const e={id:'env_'+uid(),revision:db.revision,time:now()};db.envelopes.unshift(e);db.serverRevision=db.revision;log('sync.envelope.accepted','Принят конверт '+e.id+' · ревизия '+e.revision);render();toast('Метаданные конверта доставлены');}
if(a==='pull'){if(db.offline)throw Error('Нет связи');log('sync.cursor.read','Второе демо-устройство получило курсор '+db.serverRevision);render();toast('Второе демо-устройство: ревизия '+db.serverRevision+' (симуляция)');}
if(a==='release')modal('Добавить демо-релиз','<div class="form"><label>Версия<input name="version" placeholder="1.6.0" required pattern="v?[0-9]+\\.[0-9]+\\.[0-9]+"></label><label>Канал<select name="channel"><option>stable</option><option>beta</option></select></label><label>Описание<input name="notes" maxlength="240" required></label></div>',f=>{const v=f.get('version');if(!version(v))throw Error('Допустимы только X.Y.Z / vX.Y.Z');const n=v.replace(/^v/,'');if(db.releases.some(r=>r.version===n))throw Error('Версия уже существует');db.releases.unshift({version:n,channel:f.get('channel'),notes:f.get('notes'),created:now()});log('release.cached','Добавлен демо-релиз v'+n);});
}catch(e){toast(e.message);}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.role){db.role=b.dataset.role;page=db.role==='admin'?'overview':'home';search='';filter='all';render();}else if(b.dataset.page){if(!menus[db.role].some(x=>x[0]===b.dataset.page))return;page=b.dataset.page;render();}else if(b.dataset.action)action(b.dataset.action,b.dataset.id);});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;$('#view').innerHTML=users();$('#search').focus();$('#search').setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render();}if(e.target.dataset.task){if(db.role!=='user')return;const t=db.tasks.find(t=>t.id===e.target.dataset.task);if(t&&['todo','doing','done'].includes(e.target.value)){t.status=e.target.value;db.revision++;log('task.updated','Локальная доска изменена');render();}}});
document.addEventListener('submit',e=>{if(e.target.id!=='check-form')return;e.preventDefault();const f=new FormData(e.target),v=f.get('version'),channel=f.get('channel');if(!version(v)){toast('Требуется числовая версия X.Y.Z');return;}if(db.offline){$('#check-result').innerHTML='<p class="muted">Ошибка сети. Проверка не выполнена, установка не запускается.</p>';return;}const latest=db.releases.filter(r=>r.channel===channel).sort((a,b)=>compare(b.version,a.version))[0];const available=!!latest&&compare(latest.version,v)>0;const result={updateAvailable:available,channel,currentVersion:v.replace(/^v/,''),latestVersion:latest?.version||null,release:latest?{version:latest.version,name:'Демо-релиз '+latest.version,htmlUrl:'https://github.com/Everick-Ven/shelter/releases',notes:latest.notes}:null,forceUpdate:compare(v,db.min)<0,minSupportedVersion:db.min,autoInstall:false,checkedAt:now()};$('#check-result').innerHTML=`<h3>${available?'Доступна новая демо-версия':'Обновлений нет'}</h3><pre>${esc(JSON.stringify(result,null,2))}</pre>${available?'<a href="https://github.com/Everick-Ven/shelter/releases" target="_blank" rel="noopener noreferrer">Открыть реальные релизы на GitHub ↗</a>':''}`;log('updates.checked','Проверена версия '+v+' · '+channel);});
$('#theme').onclick=()=>{db.theme=db.theme==='light'?'dark':'light';render();};$('#cancel').onclick=()=>$('#modal').close();$('#reset').onclick=()=>confirmAction('Сбросить демоверсию?','Локальные изменения, заказы и журнал будут заменены исходным набором.',()=>{db=seed();page='overview';search='';filter='all';});$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shelter-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Экспортированы только демонстрационные данные');};if(!menus[db.role])db.role='admin';page=db.role==='admin'?'overview':'home';render();
</script></html>
