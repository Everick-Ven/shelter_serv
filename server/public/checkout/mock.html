<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Симуляция оплаты — SHELTER (dev)</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/assets/manage.css" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <section class="auth">
      <div class="auth__card" style="max-width:520px">
        <a class="auth__home" href="/">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 2.5 20 6v6.2c0 4.6-3.3 8.2-8 9.3-4.7-1.1-8-4.7-8-9.3V6l8-3.5Z" stroke-linejoin="round"/>
          </svg>
          <span>SHELTER</span>
        </a>
        <h1>Симуляция оплаты</h1>
        <p class="auth__lead">
          Это <b>не платёжная система</b>. Страница существует только при
          <span class="mono">PAYMENT_PROVIDER=mock</span> вне production и нужна для
          локальной проверки полного цикла: заказ → «оплата» → серверный статус Premium.
        </p>
        <div class="detail" id="details"></div>
        <div class="auth__actions">
          <a class="btn btn--ghost btn--md" href="/account">Отмена</a>
          <button class="btn btn--primary btn--md" id="pay">Оплатить (симуляция)</button>
        </div>
        <p class="auth__hint" id="hint"></p>
      </div>
    </section>
    <script src="/assets/checkout.js" defer></script>
  </body>
</html>
